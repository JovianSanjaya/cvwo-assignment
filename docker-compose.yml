services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cvwo_forum
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: "host=postgres port=5432 user=postgres password=postgres dbname=cvwo_forum sslmode=disable"
      JWT_SECRET: your-secret-key-change-in-production
      GOOGLE_CLIENT_ID: "262341921054-lmkb28bcj5f70sbqresapdo9lqfa4o0f.apps.googleusercontent.com"
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: "262341921054-lmkb28bcj5f70sbqresapdo9lqfa4o0f.apps.googleusercontent.com"
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
